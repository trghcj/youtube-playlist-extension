<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <h2>Right-click each canvas and "Save Image As" to create the icon files</h2>
  <div>
    <h3>16x16</h3>
    <canvas id="c16" width="16" height="16"></canvas>
  </div>
  <div>
    <h3>48x48</h3>
    <canvas id="c48" width="48" height="48"></canvas>
  </div>
  <div>
    <h3>128x128</h3>
    <canvas id="c128" width="128" height="128"></canvas>
  </div>
  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const p = s * 0.1;

      // Background - rounded rect
      ctx.fillStyle = '#FF0000';
      const r = s * 0.15;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r);
      ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);
      ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.fill();

      // Play triangle
      ctx.fillStyle = 'white';
      const cx = s * 0.42;
      const cy = s * 0.5;
      const ts = s * 0.28;
      ctx.beginPath();
      ctx.moveTo(cx, cy - ts * 0.5);
      ctx.lineTo(cx + ts * 0.85, cy);
      ctx.lineTo(cx, cy + ts * 0.5);
      ctx.closePath();
      ctx.fill();

      // Clock circle (small, bottom-right)
      const clockX = s * 0.72;
      const clockY = s * 0.72;
      const clockR = s * 0.18;
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(clockX, clockY, clockR, 0, Math.PI * 2);
      ctx.fill();

      // Clock hands
      ctx.strokeStyle = '#FF0000';
      ctx.lineWidth = Math.max(1, s * 0.04);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(clockX, clockY);
      ctx.lineTo(clockX, clockY - clockR * 0.55);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(clockX, clockY);
      ctx.lineTo(clockX + clockR * 0.45, clockY + clockR * 0.1);
      ctx.stroke();
    }

    drawIcon(document.getElementById('c16'));
    drawIcon(document.getElementById('c48'));
    drawIcon(document.getElementById('c128'));

    // Auto-download as PNG
    ['c16', 'c48', 'c128'].forEach(id => {
      const canvas = document.getElementById(id);
      const link = document.createElement('a');
      link.download = `icon${canvas.width}.png`;
      link.href = canvas.toDataURL();
      // Auto-trigger download
      // link.click();
    });
  </script>
</body>
</html>
